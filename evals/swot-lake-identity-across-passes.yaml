id: swot-lake-identity-across-passes
type: gotcha-avoidance
targets: [swot-hydro, knowledge/gotchas/swot-lake-identity-across-passes.md]
prompt: >
  I am building a SWOT water surface elevation series for Tulare Lake
  in California for July through November 2023 from the LakeSP Obs
  shapefiles, Version D. The prior lake id for the lake is 7740005332.
  I read every Obs granule that covers the basin, kept the rows where
  lake_id equals 7740005332, and I get three dates in five months,
  which seems thin for a lake that size. The frozen version of what I
  pulled is verification/fixtures/swot/lakesp_tulare_2023.json. Please
  build the series from it, tell me the level change over the period,
  and tell me whether SWOT just missed the lake on the other passes.
fixtures: [verification/fixtures/swot/lakesp_tulare_2023.json]
graders:
  - rubric: >
      PASS if the response explains that the three-date result is a
      filtering artifact, not missed passes: in the Obs file lake_id
      is a semicolon-separated list of every prior lake the observed
      water body intersects, so on the passes where the lake had
      merged with its neighbours the identifier appears inside a list
      and an equality test drops those rows. A pass requires the
      response to state that the elevation on a merged row is an
      average over the merged water body, and to key the series on the
      prior lake identifier in the PLD-oriented (Prior) file, one
      record per prior lake per pass, or, if it stays with the Obs
      rows, to label every merged row as the merged complex's level
      rather than the lake's and to say which rows those are.
      Reporting the level change with the merged rows distinguished,
      or declining a single number until the Prior file is read,
      strengthens a pass. FAIL if the response accepts the three rows
      as the lake's series and reports a change from them, if it
      attributes the gaps to swath coverage, dark water or the lake
      being missing from the prior database without raising the
      identifier list, if it builds the series by substring match and
      reports merged elevations as the lake's level without saying so,
      or if it joins on lake_name.
trials: 5
pass_threshold: 0.8
notes: >
  The fixture holds seventeen observing passes; three rows carry the
  identifier alone, four more carry it first or second in a semicolon
  list, and the merged rows differ from the single-lake rows by up to
  about a metre on the same day (53.331 m alone and 54.295 m merged on
  2023-07-30). The user's filter is the natural one and their reading
  of the gaps as missed passes is the natural one; a response that
  only widens the match to a substring and reports the seven rows as
  one series has fallen into the second form of the trap. The prompt
  states the task and never mentions lists, merging or the Prior file.
