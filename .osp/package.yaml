# Package identity, content, dependencies, presentation metadata and REACH
# (ADR B). The Claude package files and the Agent Plugins package are
# rendered from this file by build-kit's osp.py render; the gate fails on
# a hand edit to any of them.
schema_version: 1
package:
  name: hydrology
  version: 0.7.0
  type: capability
content:
  skills: ./skills
  agents: ./agents
  knowledge: ./knowledge
  verification: ./verification
  evals: ./evals
dependencies:
  capabilities:
  - name: core
    version: '>=0.5.0'
  knowledge:
  - name: nasa-daac-knowledge
    version: '>=2026.9.3'
metadata:
  description: 'Hydrology: SWOT river and lake products, GRACE-FO groundwater, USGS streamflow and basin
    delineation, SMAP soil moisture, GPM IMERG and NLDAS-2 basin precipitation, MOD16 and OpenET evapotranspiration.'
  keywords:
  - hydrology
  - swot
  - rivers
  - lakes
  - grace
  - groundwater
  - nwis
  - streamflow
  - smap
  - soil-moisture
  - imerg
  - nldas
  - precipitation
  - basin
  - mod16
  - modis
  - evapotranspiration
  - openet
reach:
  servers:
    earthdata:
      type: streamable-http
      url: https://cmr.earthdata.nasa.gov/mcp/v1
    observations:
      type: stdio
      command: uv
      args:
      - run
      - https://raw.githubusercontent.com/open-science-pillars/core/2d86feaea72ef15589e9814f8088ac77673b6dfd/connectors/observations_mcp.py
